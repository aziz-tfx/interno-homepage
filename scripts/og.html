<!DOCTYPE html>
<!-- Шаблон OG-картинки 1200×630. Рендер: node scripts/build-og.mjs (нужен Playwright). ?lang=ru|uz -->
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0A090D;color:#F3EEE6;font-family:Manrope,sans-serif;position:relative}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 60%}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,9,13,.94) 0%,rgba(10,9,13,.82) 46%,rgba(10,9,13,.15) 100%)}
.in{position:absolute;inset:0;padding:60px 64px;display:flex;flex-direction:column}
.logo{height:62px;width:auto;align-self:flex-start}
h1{margin-top:auto;font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:84px;line-height:.98;max-width:720px}
.tape{position:relative;display:inline-block;color:#0A090D;padding:0 .12em;z-index:0}
.tape::before{content:'';position:absolute;z-index:-1;inset:.06em -.06em -.02em -.08em;background:#D6F23B;transform:rotate(-1.2deg)}
.dirs{margin-top:26px;font-size:21px;font-weight:600;color:#cfcad8;max-width:760px;line-height:1.45}
.foot{margin-top:24px;display:flex;gap:14px;align-items:center;font-size:18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.tag{background:#5B2BE0;color:#fff;padding:8px 14px;transform:rotate(-2deg)}
</style></head><body>
<img class="bg" src="../assets/hero/s1-d.jpg" alt="">
<div class="shade"></div>
<div class="in">
  <img class="logo" src="../assets/logo.svg" alt="">
  <h1 id="h"></h1>
  <p class="dirs" id="d"></p>
  <div class="foot"><span class="tag" id="t"></span><span id="c"></span></div>
</div>
<script>
const T={
  ru:{h:'Освой профессию <span class="tape">на практике</span>',d:'Дизайн интерьера · Архитектура · Графический дизайн · Видеомонтаж · Data-аналитика · Искусственный интеллект · Бухгалтерия',t:'Бесплатный открытый урок',c:'Ташкент · Самарканд · Фергана'},
  uz:{h:'Kasbni <span class="tape">amaliyotda</span> egallang',d:"Interyer dizayni · Arxitektura · Grafik dizayn · Videomontaj · Data-analitika · Sun'iy intellekt · Buxgalteriya",t:'Bepul ochiq dars',c:"Toshkent · Samarqand · Farg'ona"},
};
const t=T[new URLSearchParams(location.search).get('lang')||'ru'];
for(const k in t)document.getElementById(k).innerHTML=t[k];
</script>
</body></html>
